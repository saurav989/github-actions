name: Events Demo 1
on: 
  pull_request:
    types:
      - opened
    branches:
      - main # main
      - 'dev-*' # dev-new dev-this-is-new
      - 'feat/**' # feat/new feat/new/button
      # developer-1 -> will not get executed 
  workflow_dispatch:
  push:
    branches:
      - main # main
      - 'dev-*' # dev-new dev-this-is-new
      - 'feat/**' # feat/new feat/new/button
      # developer-1 -> will not get executed 
    paths-ignore:
        - '.github/workflows/*'
jobs:
  output-info:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: 'echo "Event details: ${{ toJson(github.event) }}"'
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy code
        run: echo "Deploying code..."